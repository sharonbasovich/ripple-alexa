name: MCP browser lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CAPTURE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and existing pinned browser tooling
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/ripple-capture-tools" --ignore-scripts --no-save --package-lock=false --workspaces=false playwright@1.63.0
          "$RUNNER_TEMP/ripple-capture-tools/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run build
      - name: Verify delayed connection cleanup over real browser HTTP
        run: node scripts/test-mcp-browser-lifecycle.mjs
        env:
          CAPTURE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ripple-capture-tools/node_modules/playwright/index.mjs
          VITE_GIT_COMMIT: ${{ env.CAPTURE_COMMIT }}
      - name: Verify uncertain mutation recovery over real browser HTTP
        run: node scripts/test-mcp-browser-recovery.mjs
        env:
          CAPTURE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ripple-capture-tools/node_modules/playwright/index.mjs
          VITE_GIT_COMMIT: ${{ env.CAPTURE_COMMIT }}
      - name: Upload lifecycle observations before harness shutdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-mcp-lifecycle-${{ env.CAPTURE_COMMIT }}
          path: artifacts/mcp-lifecycle/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload recovery screenshots and JSON-RPC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-mcp-recovery-${{ env.CAPTURE_COMMIT }}
          path: artifacts/mcp-recovery/
          if-no-files-found: warn
          retention-days: 14
