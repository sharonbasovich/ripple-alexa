name: Pull request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VITE_GIT_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:sim
      - run: npm run test -w @ripple/mcp-server
      - run: npm run build
